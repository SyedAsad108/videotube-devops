services:
  # ==========================================
  # Database Service (MongoDB Local)
  # ==========================================
  mongo:
    image: mongo:7.0
    container_name: videotube_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - videotube_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Caching Layer (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: videotube_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - videotube_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # VideoTube Backend API Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: videotube_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://<db_user>:<db_password>@cluster0.rlqtqky.mongodb.net/}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-videotube_dev_access_token_secret_1234567890}
      - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY:-1d}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-videotube_dev_refresh_token_secret_1234567890}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-10d}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-cloudinary}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - videotube_net

  # ==========================================
  # VideoTube Frontend Client (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: videotube_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - videotube_net

# ==========================================
# Named Volumes for State Persistence
# ==========================================
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

# ==========================================
# Isolated Container Network
# ==========================================
networks:
  videotube_net:
    driver: bridge
