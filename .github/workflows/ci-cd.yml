name: VideoTube CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  # ==========================================
  # Job 1: Path-Based Change Detection
  # Runs first to determine which components need validation & deployment
  # ==========================================
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changes by Directory
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-cd.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci-cd.yml'
            terraform:
              - 'terraform/**'
              - '.github/workflows/ci-cd.yml'

  # ==========================================
  # Job 2: Backend Testing & Syntax Check
  # Executes only when backend files or workflow changes
  # ==========================================
  test-backend:
    name: Test & Validate Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Application Syntax & App Boot
        run: node -e "import('./app.js').then(() => { console.log('App boots cleanly'); process.exit(0); }).catch((err) => { console.error(err); process.exit(1); })"

  # ==========================================
  # Job 3: Frontend Compilation & Production Build
  # Executes only when frontend files or workflow changes
  # ==========================================
  build-frontend:
    name: Compile & Build Frontend (Vite)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Optimized Production Bundle
        run: npm run build

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 1

  # ==========================================
  # Job 4: Infrastructure Code Validation
  # Executes only when terraform files or workflow changes
  # ==========================================
  validate-terraform:
    name: Validate Terraform Infrastructure
    needs: [detect-changes]
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform Manifests
        run: terraform validate

  # ==========================================
  # Job 5: Frontend Static Deployment (S3 + CloudFront)
  # Independent, fast deployment (~30s) directly to S3 with cache invalidation
  # Completely eliminates frontend Docker build and ECS container deployment
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend to S3 & Invalidate CloudFront
    needs: [detect-changes, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true'

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET || 'videotube-dev-frontend-5f087aba' }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Compiled Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Sync Hashed Static Assets to S3 (1-Year Immutable Cache)
        run: |
          echo "Syncing hashed JavaScript, CSS, and images with long-term immutable caching..."
          aws s3 sync ./frontend/dist s3://${{ env.FRONTEND_S3_BUCKET }} \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload HTML Entry Point to S3 (No-Cache Revalidation)
        run: |
          echo "Uploading index.html with no-cache revalidation headers..."
          aws s3 cp ./frontend/dist/index.html s3://${{ env.FRONTEND_S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache (Selective /index.html)
        run: |
          if [ -n "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" ] && [ "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" != "pending-account-verification" ]; then
            echo "Creating targeted CloudFront invalidation for /index.html..."
            aws cloudfront create-invalidation \
              --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/index.html"
          else
            echo "CloudFront distribution ID not configured or pending; skipping invalidation."
          fi

      - name: Verify S3 Deployment Status
        run: |
          echo "Listing deployed files in S3 frontend bucket:"
          aws s3 ls s3://${{ env.FRONTEND_S3_BUCKET }}/ --recursive

  # ==========================================
  # Job 6: Backend Continuous Deployment (Amazon ECS / EC2)
  # Independent backend pipeline: Docker build -> ECR push -> ECS rolling deploy
  # ==========================================
  deploy-backend:
    name: Build, Push & Deploy Backend to Amazon ECS
    needs: [detect-changes, test-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true'

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'videotube-dev-cluster' }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'videotube-dev-backend' }}
      ECS_BACKEND_SERVICE: ${{ vars.ECS_SERVICE || 'videotube-dev-service' }}
      BACKEND_TASK_FAMILY: "videotube-dev-backend"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Backend Docker Image
        id: build-backend-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Backend Docker image: $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"
          docker build \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest \
            ./backend
          echo "Pushing immutable tag ($IMAGE_TAG)..."
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
          echo "Pushing 'latest' tag..."
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download Active Backend Task Definition
        run: |
          echo "Downloading Backend Task Definition..."
          aws ecs describe-task-definition \
            --task-definition ${{ env.BACKEND_TASK_FAMILY }} \
            --region ${{ env.AWS_REGION }} \
            --query taskDefinition > backend-task-def-raw.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' backend-task-def-raw.json > backend-task-definition.json

      - name: Render New Backend Task Definition
        id: render-backend-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: backend
          image: ${{ steps.build-backend-image.outputs.image }}
          environment-variables: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}

      - name: Deploy Backend ECS Task Definition & Wait for Stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend-container.outputs.task-definition }}
          service: ${{ env.ECS_BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify Live Backend Endpoints
        run: |
          echo "--- Backend ECS Service Status ---"
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_BACKEND_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query "services[0].{Status:status,Desired:desiredCount,Running:runningCount,TaskDef:taskDefinition}"
          echo ""
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "videotube-dev-alb" --region ${{ env.AWS_REGION }} --query "LoadBalancers[0].DNSName" --output text)
          echo "Testing Backend API Healthcheck on http://$ALB_DNS/api/v1/healthcheck ..."
          curl -s "http://$ALB_DNS/api/v1/healthcheck"
          echo ""
          echo "Backend deployment and verification completed successfully!"
