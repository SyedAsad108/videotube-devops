name: VideoTube CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  # ==========================================
  # Job 1: Backend Testing & Linting
  # ==========================================
  test-backend:
    name: Test & Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Application Syntax & App Boot
        run: node -e "import('./app.js').then(() => { console.log('App boots cleanly'); process.exit(0); }).catch((err) => { console.error(err); process.exit(1); })"

  # ==========================================
  # Job 2: Frontend Compilation & Build
  # ==========================================
  build-frontend:
    name: Compile & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

  # ==========================================
  # Job 3: Infrastructure Code Validation
  # ==========================================
  validate-terraform:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform Manifests
        run: terraform validate

  # ==========================================
  # Job 4: Continuous Deployment to Amazon ECS (EC2)
  # Region: ap-south-1
  # ==========================================
  deploy-to-aws:
    name: Build, Push & Deploy to Amazon ECS (EC2)
    needs: [test-backend, build-frontend, validate-terraform]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      # Task definition family must match what Terraform created
      ECS_TASK_FAMILY: "videotube-dev-backend"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./backend
          echo "Pushing immutable image tag ($IMAGE_TAG) to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "Pushing 'latest' image tag to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        id: build-image

      - name: Download Active ECS Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --region ${{ env.AWS_REGION }} \
            --query taskDefinition > task-def-raw.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-def-raw.json > task-definition.json
          echo "Active task definition downloaded. Image in task:"
          jq '.containerDefinitions[0].image' task-definition.json

      - name: Render New Task Definition with Immutable Image Tag & Secrets
        id: render-backend-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}

      - name: Deploy Amazon ECS Task Definition & Wait for Stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend-container.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify Live Deployment
        run: |
          echo "=================================================="
          echo "  ECS (EC2) DEPLOYMENT COMPLETED & SERVICE STABLE  "
          echo "=================================================="
          echo "Region:   $AWS_REGION"
          echo "Cluster:  $ECS_CLUSTER"
          echo "Service:  $ECS_SERVICE"
          echo "Image:    ${{ steps.build-image.outputs.image }}"
          echo ""
          echo "--- ECS Service Deployment Status ---"
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query "services[0].{Status:status,Desired:desiredCount,Running:runningCount,TaskDef:taskDefinition,LaunchType:launchType,CapacityProviders:capacityProviderStrategy}"
          echo ""
          echo "--- Registered EC2 Container Instances ---"
          aws ecs list-container-instances \
            --cluster ${{ env.ECS_CLUSTER }} \
            --region ${{ env.AWS_REGION }} \
            --query "containerInstanceArns"
