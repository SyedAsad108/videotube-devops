apiVersion: apps/v1
kind: Deployment
metadata:
  name: videotube-frontend
  namespace: videotube
  labels:
    app: videotube-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: videotube-frontend
  template:
    metadata:
      labels:
        app: videotube-frontend
    spec:
      containers:
        - name: frontend
          image: videotube-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: videotube-frontend-service
  namespace: videotube
  labels:
    app: videotube-frontend
spec:
  type: ClusterIP
  selector:
    app: videotube-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
